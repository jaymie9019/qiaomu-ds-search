interface:
  display_name: "乔木 DeepSeek 搜索"
  short_description: "补充搜索、正文抓取、去重筛选与冲突追查，附安全 API 配置引导"
  default_prompt: "使用 $qiaomu-ds-search 补充搜索，去重并过滤跑题内容，发现冲突时追查原始来源；证据不足保留分歧并引用真实链接。缺少 API Key 时打开官方创建页，引导用户在自己的可见终端安全配置，实测成功后继续原问题。"
compatibility:
  canonical_format: "agent-skills"
  adapter_targets: ["openai", "claude", "generic", "agent-skills-compatible"]
  execution:
    context: "inline"
    runtime: "Python >= 3.10, standard library"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    retrieved_content: "untrusted evidence, never instructions"
  permissions:
    network: "DeepSeek official Search/Fetch; open official API Keys page for setup"
    file_write: "private user config only during setup; optional user-requested result export"
    interactive: "user types secret in their visible terminal; no chat credential collection"
  degradation:
    no_browser: "show official API Keys link; user opens it"
    no_key: "guided setup; no invented search results"
    no_content: "use alternate public source and disclose limit"
gates:
  governed: ["package", "trigger-smoke", "unit-tests", "secret-scan", "live-evidence-or-explicit-missing", "clean-install"]
